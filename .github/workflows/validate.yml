name: Validate Terraform Modules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aws:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.2"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.19

      - name: Validate AWS module
        run: |
          set -euo pipefail
          terraform -chdir=modules/aws fmt -check -diff
          terraform -chdir=modules/aws init -backend=false
          terraform -chdir=modules/aws validate
          bash -n modules/aws/scripts/*.sh
          checkov --directory modules/aws --framework terraform --baseline modules/aws/.checkov.baseline --quiet --compact --skip-download
          checkov --directory . --framework secrets --quiet --compact --skip-download
